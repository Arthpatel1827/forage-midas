spring.application.name=midas-core

# App HTTP port (Task 5 requires 33400)
server.port=33400

# H2 (the tests use JPA + H2)
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driverClassName=org.h2.Driver
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Kafka
general.kafka-topic=midas.transactions
# Use the embedded-kafka value when tests run; fall back to localhost:9092 when running the app manually
spring.kafka.bootstrap-servers=${spring.embedded.kafka.brokers:localhost:9092}
# Provide a default so the placeholder always resolves outside tests
spring.embedded.kafka.brokers=localhost:9092

# Incentive API (Task 4)
incentive.api.base-url=http://localhost:8080
